<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuraDock</title>
<meta name="description" content="Your phone, calm and useful on the desk.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="logo.png" type="image/png">
<style>
@font-face{font-family:"Mona Sans";src:url("fonts/MonaSans.ttf") format("truetype");font-weight:200 900;font-display:swap}
@font-face{font-family:"Inter";src:url("fonts/Inter.ttf") format("truetype");font-weight:100 900;font-display:swap}
:root{--bg:#000;--text:#fff;--muted:#a3a3a3;--line:#242424;--accent:#feffed}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3rem 1rem}
img{width:112px;height:112px;border-radius:26px;display:block}
h1{margin:1.75rem 0 0;font:800 clamp(2.5rem,9vw,4rem)/1.05 "Mona Sans","Host Grotesk","Inter",sans-serif;letter-spacing:-.02em}
p{margin:1rem 0 0;max-width:24rem;font-size:1.2rem;color:var(--muted)}
nav{display:flex;gap:1.75rem;margin-top:2.25rem;font-weight:500}
a{color:var(--accent);text-underline-offset:4px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}
footer{padding:1.5rem 1rem;text-align:center;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<main>
<img src="logo.png" alt="AuraDock logo" width="112" height="112">
<h1>AuraDock</h1>
<p>Your phone, calm and useful on the desk</p>
<nav>
<a href="privacy/">Privacy policy</a>
<a href="https://github.com/AlbinVishwas/auradock">GitHub</a>
</nav>
</main>
<footer>No trackers, no analytics, no cookies on this site.</footer>
</body>
</html>
