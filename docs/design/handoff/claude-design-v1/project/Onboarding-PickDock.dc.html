<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuraDock · Pick your dock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Mona+Sans:wght@500..900&amp;family=Nunito:wght@900&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 412px; height: 915px; background: #000000; color: #FFFFFF; font-family: Inter, sans-serif; position: relative; box-sizing: border-box; padding: 64px 0 40px; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 0 28px">
<h1 style="margin: 0; font-family: 'Mona Sans', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.1">Pick your dock</h1>
<p style="margin: 12px 0 0; font-size: 15px; line-height: 1.45; color: #A3A3A3">Swipe to preview. Change it any time.</p>
</div>

<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px">
<div role="listbox" aria-label="Dock templates" style="display: flex; align-items: center; gap: 16px; padding-left: 46px">
<div role="option" aria-selected="true" aria-label="Bold" style="width: 320px; height: 144px; flex: none; box-sizing: border-box; border-radius: 22px; background: #000000; border: 2px solid #FEFFED; display: flex; align-items: center; justify-content: center; overflow: hidden">
<div style="display: flex; align-items: center; font-family: Nunito, ui-rounded, sans-serif; font-weight: 900; font-size: 124px; line-height: 0.8; font-variant-numeric: tabular-nums; isolation: isolate">
<span style="color: rgba(255,90,78,0.8); mix-blend-mode: screen; transform: rotate(-3deg)">1</span>
<span style="color: rgba(255,143,134,0.8); mix-blend-mode: screen; margin-left: -0.12em; transform: rotate(5deg)">2</span>
<span style="display: flex; flex-direction: column; gap: 0.1em; margin: 0 -0.06em 0 0.02em; mix-blend-mode: screen"><span style="width: 0.17em; height: 0.17em; border-radius: 50%; background: rgba(200,200,200,0.8)"></span><span style="width: 0.17em; height: 0.17em; border-radius: 50%; background: rgba(200,200,200,0.8)"></span></span>
<span style="color: rgba(255,90,78,0.8); mix-blend-mode: screen; transform: rotate(-4deg)">3</span>
<span style="color: rgba(255,143,134,0.8); mix-blend-mode: screen; margin-left: -0.12em; transform: rotate(5deg)">0</span>
</div>
</div>
<div role="option" aria-selected="false" aria-label="Classic" style="width: 320px; height: 144px; flex: none; box-sizing: border-box; border-radius: 22px; background: #000000; border: 1px solid #262626; opacity: 0.4; transform: scale(0.88); transform-origin: left center; display: flex; flex-direction: column; justify-content: center; padding-left: 28px">
<div style="font-family: 'Mona Sans', sans-serif; font-weight: 700; font-size: 72px; line-height: 1">12:30</div>
<div style="font-size: 14px; color: #A3A3A3; margin-top: 6px">Thursday, 5 November</div>
</div>
</div>

<div style="padding: 0 46px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-family: 'Mona Sans', sans-serif; font-weight: 700; font-size: 24px">Bold</span>
<span style="font-size: 12px; font-weight: 600; color: #FEFFED; border: 1px solid #3A3A33; border-radius: 10px; padding: 3px 8px">Default</span>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.4; color: #A3A3A3">A giant two-tone clock. Nothing else.</p>
<p style="margin: 10px 0 0; font-size: 13px; color: #8A8A8A">1 of 5 · Bold, Classic, Focus, Minimal, Productivity</p>
</div>
</div>

<div style="padding: 0 28px; display: flex; flex-direction: column; gap: 28px">
<div aria-label="Step 4 of 4" style="display: flex; gap: 8px; justify-content: center">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #3A3A3A"></span>
<span style="width: 8px; height: 8px; border-radius: 4px; background: #3A3A3A"></span>
<span style="width: 8px; height: 8px; border-radius: 4px; background: #3A3A3A"></span>
<span style="width: 24px; height: 8px; border-radius: 4px; background: #FFFFFF"></span>
</div>
<a href="Main.dc.html" style="height: 56px; border-radius: 28px; background: #FEFFED; color: #000000; display: flex; align-items: center; justify-content: center; font-family: 'Mona Sans', sans-serif; font-weight: 700; font-size: 18px">Use this dock</a>
</div>

<div style="position: absolute; left: 152px; bottom: 10px; width: 108px; height: 4px; border-radius: 2px; background: #9A9A9A"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
